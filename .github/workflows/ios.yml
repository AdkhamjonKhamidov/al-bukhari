# Builds the iOS app on a GitHub-hosted Mac (no Mac needed locally).
# Output: AlBukhari-ios-simulator.zip, an iPhone-simulator build that runs
# in the browser on appetize.io. Runs on every push that changes the app,
# or by hand from the Actions tab.
name: iOS

on:
  push:
    paths: ['al_bukhari/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: al_bukhari
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Rust targets for iOS
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - run: flutter pub get

      - name: Build for the iPhone simulator
        run: flutter build ios --simulator --debug

      - name: Package the simulator app
        run: ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app AlBukhari-ios-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AlBukhari-ios-simulator
          path: al_bukhari/AlBukhari-ios-simulator.zip
