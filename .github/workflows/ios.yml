# Builds the iOS app on a GitHub-hosted Mac (no Mac needed locally).
# Output: an iPhone-simulator build (zip) to try in the browser on
# appetize.io. If a walkthrough is present in integration_test/, it also
# runs it on a simulator and saves a screenshot of each screen.
name: iOS

on:
  push:
    paths: ['al_bukhari/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: al_bukhari
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Rust targets for iOS
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - run: flutter pub get

      - name: Build for the iPhone simulator
        run: flutter build ios --simulator --debug

      - name: Package the simulator app
        run: ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app AlBukhari-ios-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AlBukhari-ios-simulator
          path: al_bukhari/AlBukhari-ios-simulator.zip

      - name: Walk through the app on a simulator
        if: hashFiles('al_bukhari/integration_test/*.dart') != ''
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          print(next(x['udid'] for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          flutter drive --driver=test_driver/integration_test.dart \
            --target=integration_test/walkthrough_test.dart -d "$UDID"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: al_bukhari/screenshots
          if-no-files-found: ignore
